name: Extension checks
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly look at upstream main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: omacom/omarchy
          ref: 346e69e1cec6c4e8924531874af6ba010a1bc99e
          path: test-artifacts/upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/niri-model-test.cjs
      - run: bash tests/test_extension.sh
      - run: bash tests/coverage.sh test-artifacts/upstream
      - name: Valid Omarchy plugin
        # Validate a clean export, which is what omarchy plugin add clones.
        run: |
          mkdir -p /tmp/plugin && git archive HEAD | tar -x -C /tmp/plugin
          bash test-artifacts/upstream/bin/omarchy-plugin-validate /tmp/plugin
      - name: Patches apply to the pinned Omarchy
        run: |
          cd test-artifacts/upstream
          find ../../patches -name '*.patch' | while read -r p; do
            t=${p#../../patches/}; git apply --include="${t%.patch}" "$p"
          done

  # Not a gate: tells us before users do when upstream main moves under a patch
  # or adds a compositor call we do not cover.
  upstream-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: omacom/omarchy
          path: test-artifacts/upstream
      - run: bash tests/coverage.sh test-artifacts/upstream
      - run: |
          cd test-artifacts/upstream
          find ../../patches -name '*.patch' | while read -r p; do
            t=${p#../../patches/}; git apply --include="${t%.patch}" "$p" || echo "::warning::${t%.patch} no longer applies"
          done
